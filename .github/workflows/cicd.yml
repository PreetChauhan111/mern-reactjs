name: Deploy React.js App

on:
  push:
    branches:
      - deploy-react

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker image
      run: docker build -t preetchauhan/reactjs-mern:latest --build-arg REACT_APP_NODE_ENV='production' REACT_APP_SERVER_BASE_URL='${{ secrets.REACT_APP_SERVER_BASE_URL }}'  .

    - name: Push Docker image
      run: docker push preetchauhan/reactjs-mern:latest

  deploy:
    needs: build
    runs-on: ["self-hosted", "linux", "x64"]

    steps:
      - name: Pull Docker image
        run: docker pull preetchauhan/reactjs-mern:latest

      - name: remove old container
        run: |
          docker rm -f reactjs-mern-container || true

      - name: Run Docker container
        run: docker run -d -p 3000:80 --name reactjs-mern-container --env MONGO_PASSWORD="${{ secrets.MONGO_PASSWORD }}" preetchauhan/reactjs-mern:latest